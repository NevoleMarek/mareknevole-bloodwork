name: Conventional PR title

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

env:
  CONVCO_VERSION: v0.4.2
  # SHA-256 of convco-ubuntu.zip for CONVCO_VERSION.
  CONVCO_ARCHIVE_SHA256: b83ca3aff647ac3cd17c1b68f15005244a7f9022f4fadbcf76bc9e3461905a11

jobs:
  validate:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install convco
        run: |
          convco_archive="${RUNNER_TEMP}/convco-${CONVCO_VERSION}.zip"
          curl -sSfL \
            "https://github.com/convco/convco/releases/download/${CONVCO_VERSION}/convco-ubuntu.zip" \
            --output "$convco_archive"
          printf '%s  %s\n' "$CONVCO_ARCHIVE_SHA256" "$convco_archive" \
            | sha256sum --check --strict
          unzip -p "$convco_archive" convco > "${RUNNER_TEMP}/convco"
          install -m 0755 "${RUNNER_TEMP}/convco" /usr/local/bin/convco
      - name: Check PR title is conventional
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" \
            | convco check \
              --from-stdin \
              --config .github/versionrc
